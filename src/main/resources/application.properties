app.name=My Minimal App
app.timeout=5000

# Open-Meteo API only released 3 months of historical data, so set dates accordingly
# London AQM data expets two dates (e.g., start 2025-11-01 and end 2025-11-02 retrieve data for 1st Nov 2025)
app.startdate=2026-05-16
app.enddate=2026-05-31

app.downloadData=true
app.loadJsonFiles=true
app.generateScenario1=true
app.generateScenario2=false

# Air Quality Monitoring Stations
app.locations[0].name=Wandsworth - Battersea (AQM)
app.locations[0].role=AQM_BATTERSEA
app.locations[0].dataSource=LondonAir
app.locations[0].url=https://api.erg.ic.ac.uk/AirQuality/Data/Wide/Site/SiteCode=WAA/StartDate=%s/EndDate=%s/Json
app.locations[0].latitude=51.47943
app.locations[0].longitude=-0.14178
app.locations[0].datafolder=data/aqm-battersea/
app.locations[0].fileformat=WAA-%s_%s.json

app.locations[1].name=Richmond Upon Thames - Richmond (AQM)
app.locations[1].role=AQM_RICHMOND
app.locations[1].dataSource=LondonAir
app.locations[1].url=https://api.erg.ic.ac.uk/AirQuality/Data/Wide/Site/SiteCode=RHI/StartDate=%s/EndDate=%s/Json
app.locations[1].latitude=51.46389
app.locations[1].longitude=-0.30168
app.locations[1].datafolder=data/aqm-richmond/
app.locations[1].fileformat=RHI-%s_%s.json

# Weather Data

## Airport wind direction at 180m (ALL SCENARIOS; IDENTIFIES RUNWAY USAGE)
app.locations[2].name=London Heathrow Airport (Weather)
app.locations[2].role=WEATHER_HEATHROW
app.locations[2].dataSource=OpenMeteo
app.locations[2].url=https://api.open-meteo.com/v1/forecast?latitude=51.4706&longitude=-0.4619&hourly=wind_direction_180m,wind_speed_180m&wind_speed_unit=kn&start_date=%s&end_date=%s
app.locations[2].latitude=51.47060
app.locations[2].longitude=-0.46190
app.locations[2].datafolder=data/weather-heathrow/
app.locations[2].fileformat=LHR-%s_%s.json

## Richmond wind direction at 180m (SCENARIO 3)
app.locations[3].name=Richmond Upon Thames - Richmond (Weather)
app.locations[3].role=WEATHER_RICHMOND
app.locations[3].dataSource=OpenMeteo
app.locations[3].url=https://api.open-meteo.com/v1/forecast?latitude=51.4706&longitude=-0.4619&hourly=wind_direction_180m,wind_speed_180m&wind_speed_unit=kn&start_date=%s&end_date=%s
app.locations[3].latitude=51.46389
app.locations[3].longitude=-0.30168
app.locations[3].datafolder=data/weather-richmond/
app.locations[3].fileformat=RHI-%s_%s.json

