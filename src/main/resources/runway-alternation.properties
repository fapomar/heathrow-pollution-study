# Heathrow Runway Alternation Programme 2026
# Source: Heathrow_Runway_Alternation_Programme_2026.pdf
#
# Key format: runway.YYYY-MM-DD.<slot>  where YYYY-MM-DD is the Monday of the week
#
# Slots:
#   day.morning   = landing runway 06:00-15:00  (westerly operations only)
#   day.afternoon = landing runway 15:00-last departure  (westerly operations only)
#   night.primary = primary landing runway, last departure-06:00
#   night.secondary = same physical runway, opposite approach direction (weather fallback)
#
# Special cases (handled in RunwayService, not encoded here):
#   06:00-07:00        -> both runways used simultaneously
#   Monday before 06:00 -> follows previous week's night pattern
#   Easterly operations -> southern runway (27L) always used regardless of day schedule

# Runway codes:
#   27R = northern runway, aircraft approaching from the east
#   27L = southern runway, aircraft approaching from the east
#   09L = northern runway, aircraft approaching from the west
#   09R = southern runway, aircraft approaching from the west

